version: 2
updates:
  # Python dependencies in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Conventional Commits, as commitlint checks: "build(deps): ..."
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    # "ci(deps): ..."
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
