name: Bug report
description: Something in Dotiphant does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you paste anything: do not include message text, chat names, phone numbers, API hashes, tokens, pairing codes or session files. Replace them with placeholders.
        Security problems go through a private report instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dotiphant ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `dotiphant doctor`
      description: Paste the full output. Check it for personal data first.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dotiphant version
      description: Output of `dotiphant --version`.
      placeholder: dotiphant 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.3, Ubuntu 24.04, ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Dotiphant?
      options:
        - install.sh (curl ... | sh)
        - uv tool install
        - uvx
        - pipx
        - pip
        - From a source checkout
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Optional. Logs never contain message text, but check for names or ids you do not want to share.
      render: text
