<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168" role="img" aria-label="A lens over chat messages"><style>.lf{fill:var(--lens-faint,#dcdcd6)}.ls{fill:var(--lens-sharp,#9a9d9c)}.lh{fill:var(--lens-hit,#f0a27f)}.lg{fill:var(--lens-glass,#fff)}.lr{fill:none;stroke:var(--lens-ink,#141515)}.ld{fill:var(--lens-dot,#c2512a)}</style><defs><g id="rows"><rect x="16" y="6" width="118" height="12" rx="6"/><rect x="16" y="26" width="76" height="12" rx="6"/><rect x="118" y="50" width="106" height="12" rx="6"/><rect x="16" y="98" width="98" height="12" rx="6"/><rect x="16" y="118" width="134" height="12" rx="6"/><rect x="146" y="142" width="78" height="12" rx="6"/></g><rect id="hit" x="16" y="74" width="172" height="12" rx="6"/><clipPath id="c"><circle cx="152" cy="80" r="45"/></clipPath></defs><g class="lf"><g class="lens-drift"><use href="#rows"/><use href="#rows" y="168"/><use href="#hit"/><use href="#hit" y="168"/></g></g><circle cx="152" cy="80" r="45" class="lg"/><g clip-path="url(#c)"><g class="lens-drift"><g class="ls"><use href="#rows"/><use href="#rows" y="168"/></g><g class="lh lens-match"><use href="#hit"/><use href="#hit" y="168"/></g></g></g><circle cx="152" cy="80" r="48" class="lr" stroke-width="7"/><circle cx="166" cy="66" r="10" class="ld lens-dot"/></svg>
